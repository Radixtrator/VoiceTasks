# Builds signed phone and watch APKs for a version tag (v1.2.3) and attaches them to a
# GitHub release, which Obtainium picks up.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
            exit 1
          fi
          # v1.2.3 -> 10203, so every later tag installs as an update.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      # The apps are signed with the developer's debug key, so releases and local
      # `adb install` builds update each other. Without it every APK would get a
      # fresh random key and Android would refuse to install it as an update.
      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Test and build
        run: >
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :wear:assembleRelease
          -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "VoiceTasks-$VERSION_NAME-phone.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "VoiceTasks-$VERSION_NAME-wear.apk"
          gh release create "$GITHUB_REF_NAME" VoiceTasks-*.apk \
            --title "Voice Tasks $VERSION_NAME" --generate-notes
